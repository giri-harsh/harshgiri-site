<style>
:root { --ink: #121211; --paper: #F1ECE3; }
body.locked { overflow: hidden; }
/* loader */
.loader { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; transition: opacity .7s var(--ease), visibility .7s; }
.loader.gone { opacity: 0; visibility: hidden; }
.ring { position: relative; width: 220px; height: 220px; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke: var(--fg); stroke-width: 1; }
.ring .pct { position: absolute; top: 34px; left: 50%; translate: -50% 0; font: 600 13px var(--mono); }
.logo { width: 64px; height: 64px; border-radius: 50%; background: var(--fg); display: grid; place-items: center; }
.logo svg { width: 36px; height: 36px; }
.run { margin-top: 40px; opacity: 0; transform: translateY(8px); transition: opacity .5s, transform .5s var(--ease), background .3s, color .3s; font: 600 13px var(--mono); letter-spacing: .5em; text-transform: uppercase; background: none; border: 1px solid var(--mid); border-radius: 999px; padding: 16px 44px 16px 52px; cursor: pointer; }
.run.on { opacity: 1; transform: none; }
.run:hover, .run:focus-visible { background: var(--acc); color: var(--on-acc); border-color: var(--acc); outline: none; }
.boot { margin-top: 18px; font: 400 11px var(--mono); color: var(--mid); height: 14px; letter-spacing: .1em; }
.top .logo { width: 42px; height: 42px; } .top .logo svg { width: 22px; height: 22px; }
.navl a svg { position: absolute; left: 8px; right: 8px; bottom: 2px; width: calc(100% - 16px); height: 8px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.theme { display: inline-flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--tbg) 82%, transparent); color: var(--tfg); border: 1px solid var(--tln); backdrop-filter: blur(10px); transition: background .5s, color .5s, border-color .5s; border-radius: 999px; padding: 9px 14px; cursor: pointer; font: 600 11px var(--mono); letter-spacing: .18em; text-transform: uppercase; }
.side { position: fixed; left: calc(var(--g) - 16px); top: 50%; translate: 0 -50%; z-index: 30; display: grid; gap: 12px; color: var(--tfg); transition: color .5s; }
:root { --tbg: var(--card); --tfg: var(--fg); --tln: var(--line); }
.side a { background: color-mix(in srgb, var(--tbg) 80%, transparent); border: 1.5px solid var(--tln); border-radius: 50%; backdrop-filter: blur(8px); transition: background .5s, border-color .5s, transform .35s var(--pop); }
.side .lab { background: var(--tfg); color: var(--tbg); padding: 5px 9px; border-radius: 6px; }
.side a { position: relative; width: 54px; height: 54px; display: grid; place-items: center; isolation: isolate; }
.side a .lab { position: absolute; left: 54px; white-space: nowrap; font: 600 11px var(--mono); letter-spacing: .18em; text-transform: uppercase; opacity: 0; transform: translateX(-8px); transition: opacity .25s, transform .35s var(--pop); pointer-events: none; }
.side a:hover .lab, .side a:focus-visible .lab { opacity: 1; transform: none; }
.status { position: fixed; right: calc(var(--g) - 4px); bottom: 34px; z-index: 30; writing-mode: vertical-rl; transform: rotate(180deg); display: flex; align-items: center; gap: 10px; color: var(--tfg); transition: color .5s; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--tfg); opacity: .45; transition: opacity .2s, background .3s; }
.status.run i { background: var(--acc); box-shadow: 0 0 0 1.5px var(--tfg); }
.status.run i { opacity: 1; }
@media (max-width: 860px) { .side, .status { display: none; } .navl a { padding: 8px 6px; letter-spacing: .1em; font-size: 11px; } .theme span { display: none; } .top { padding: 14px 14px; } }
@media (max-width: 480px) { .navl a:nth-child(4) { display: none; } }
/* hero */
.hero { position: relative; height: 100svh; overflow: hidden; }
#graph { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; }
#graph.drag { cursor: grabbing; } #graph.over { cursor: pointer; }
.hero .inner { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; z-index: 1; }
.hero .who { margin-bottom: 22px; color: var(--mid); }
.hero h1 { margin: 0; font-size: clamp(64px, 11.2vw, 190px); }
.hero h1 .l { display: block; overflow: hidden; padding: 0 .04em; }
.hero h1 .l > span { display: inline-block; }
.blob { position: absolute; width: 26vw; height: 26vw; min-width: 180px; min-height: 180px; left: 4vw; top: 46%; border-radius: 50%; background: var(--acc); pointer-events: none; }
.hero .cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 34px; pointer-events: auto; }
.hero .cta .btn { background: var(--bg); }
.hero .cta .btn.hot { background: var(--acc); }
.hero .cta .btn .dd { width: 18px; height: 18px; }
.sites { display: flex; gap: 6px; }
.sites a { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--tln); background: color-mix(in srgb, var(--tbg) 82%, transparent); color: var(--tfg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font: 600 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; transition: background .3s, color .3s, border-color .3s; }
.sites a:hover, .sites a:focus-visible { background: var(--acc); color: var(--on-acc); border-color: var(--acc); }
.sites a .dd { width: 16px; height: 16px; }
@media (max-width: 1100px) { .sites a span { display: none; } .sites a { width: 40px; padding: 0; justify-content: center; } }
@media (max-width: 560px) { .sites { display: none; } }
.top .logo { flex: none; }
.hint { position: absolute; left: 50%; bottom: 30px; translate: -50% 0; color: var(--mid); z-index: 2; white-space: nowrap; }
.tip { position: absolute; z-index: 3; pointer-events: none; background: var(--fg); color: var(--bg); padding: 10px 12px; border-radius: 10px; max-width: 240px; font: 400 12px/1.45 var(--mono); opacity: 0; transform: translate(-50%, calc(-100% - 18px)); transition: opacity .2s; }
.tip b { display: block; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; font-size: 10px; margin-bottom: 4px; color: var(--acc); }
.tip.on { opacity: 1; }
@media (max-width: 760px) { .blob { left: -14vw; top: 58%; } #graph { opacity: .5; } }
/* sections */
section.s { position: relative; padding: 13vh var(--g); }
.lbl { color: var(--mid); margin-bottom: 26px; display: flex; gap: 14px; align-items: center; }
.rev { position: relative; }
.rev p { margin: 0; font-weight: 700; font-variation-settings: "wdth" 92; font-size: clamp(34px, 5.1vw, 84px); line-height: 1.04; letter-spacing: -.025em; }
/* the un-revealed words still have to be readable: .5 is the dimmest that clears 3:1 for large
   text on paper (3.39:1) and on ink (4.16:1) — below that this fails WCAG 1.4.3. */
.rev .front .w { opacity: .5; }
.rev .front em { font-style: normal; color: var(--acc-fg); background: linear-gradient(var(--hl), var(--hl)) no-repeat 0 0 / var(--m, 0%) 100%; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.rev .back { position: absolute; inset: -40px; padding: 40px; pointer-events: none; background: var(--acc); color: var(--on-acc); clip-path: circle(var(--r, 0px) at var(--x, 50%) var(--y, 50%)); }
.peek { margin-top: 22px; color: var(--mid); }
/* what I build */
.do ul { margin: 0; padding: 0; }
.do li { list-style: none; position: relative; border-top: 1px solid var(--line); }
.do .row { display: grid; grid-template-columns: 1fr; align-items: end; gap: 8px; padding: 6px 0 10px; }
.do .t { white-space: nowrap; font-size: clamp(40px, 8.2vw, 140px); background: linear-gradient(90deg, var(--fg) 0 50%, var(--dim) 50% 100%); background-size: 200% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; color: transparent; }
.do .d { color: var(--mid); max-width: 44ch; font-size: 15px; transition: color .3s; }
.do .d b { color: var(--fg); font-weight: 600; background: linear-gradient(var(--hl), var(--hl)) no-repeat 0 85% / 100% 40%; }
[data-theme="dark"] .do .d b { color: var(--acc); background: none; }
.do li::after { content: ""; position: absolute; left: 0; top: -1px; height: 2px; width: 100%; background: var(--acc); transform: scaleX(0); transform-origin: 0 50%; transition: transform .6s var(--ease); }
@media (min-width: 1000px) { .do .row { grid-template-columns: 1fr 360px; } .do .d { padding-bottom: 1.4vw; } }
@media (hover: hover) { .do li:hover .t { background-position: 0 0 !important; } .do li:hover .d { color: var(--fg); } .do li:hover::after { transform: scaleX(1); } }
/* RAG agent */
.ask { display: grid; grid-template-columns: 1fr; background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: 0 30px 80px -40px #12121140; }
@media (min-width: 1020px) { .ask { grid-template-columns: 1fr 1.1fr; } }
.ask .l { padding: 30px; display: grid; gap: 18px; align-content: start; border-bottom: 1px solid var(--line); }
@media (min-width: 1020px) { .ask .l { border-bottom: 0; border-right: 1px solid var(--line); } }
.ask h3 { margin: 0; font-size: clamp(32px, 3.4vw, 52px); }
.note { color: var(--mid); font-size: 14px; margin: 0; }
.mode { display: inline-flex; gap: 8px; align-items: center; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; width: max-content; }
.mode i { width: 8px; height: 8px; border-radius: 50%; background: var(--mid); } .mode.llm i { background: var(--acc); box-shadow: 0 0 0 1.5px var(--ring); }
.chips2 { display: flex; flex-wrap: wrap; gap: 8px; }
.chips2 button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 9px 13px; min-height: 40px; font: 500 12px var(--mono); cursor: pointer; transition: background .2s, border-color .2s; text-align: left; }
.chips2 button:hover { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.chips2 button.warn::before { content: "⚠ "; }
.askf { display: flex; gap: 8px; border: 1px solid var(--line); border-radius: 14px; padding: 6px 6px 6px 16px; background: var(--bg); }
.askf input { flex: 1; min-width: 0; border: 0; background: none; font: 400 15px var(--mono); color: var(--fg); outline: none; }
.askf button { border: 0; background: var(--fg); color: var(--bg); border-radius: 10px; padding: 0 18px; min-height: 42px; font: 600 12px var(--mono); letter-spacing: .15em; text-transform: uppercase; cursor: pointer; }
.askf button:hover { background: var(--acc); color: var(--on-acc); }
.arch { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.arch div { border: 1px dashed var(--line); border-radius: 10px; padding: 8px 6px; text-align: center; font: 500 10px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--mid); transition: background .25s, color .25s, border-color .25s, transform .3s var(--pop); }
.arch div b { display: block; font: 600 11px var(--mono); color: var(--fg); margin-top: 4px; letter-spacing: 0; text-transform: none; min-height: 14px; }
.arch div.go { background: var(--acc); color: var(--on-acc); border: 1px solid var(--acc); transform: translateY(-3px); }
.arch div.go b { color: var(--on-acc); }
.arch div.fail { background: #FF5A36; color: #fff; border-color: #FF5A36; } .arch div.fail b { color: #fff; }
@media (max-width: 560px) { .arch { grid-template-columns: repeat(3, 1fr); } }
.trace { padding: 20px 24px; font: 400 12.5px/1.65 var(--mono); min-height: 420px; display: flex; flex-direction: column; gap: 3px; background: repeating-linear-gradient(var(--card) 0 27px, var(--line) 27px 28px); }
.trace .ln { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; opacity: 0; transform: translateY(4px); transition: opacity .25s, transform .25s; }
.trace .ln.in { opacity: 1; transform: none; }
.trace .k { color: var(--mid); } .trace .k::before { content: "● "; color: var(--acc); -webkit-text-stroke: .6px var(--ring); }
.trace .ln.bad .k::before { color: #FF5A36; }
.trace .ms { color: var(--mid); font-size: 11px; }
.trace .ans { margin-top: 12px; font: 600 clamp(17px, 1.5vw, 21px)/1.45 var(--sans); letter-spacing: -.01em; }
.trace .ans sup { font: 600 10px var(--mono); background: var(--acc); color: var(--on-acc); border-radius: 4px; padding: 1px 5px; margin-left: 3px; cursor: pointer; }
.trace .src { margin-top: 10px; display: grid; gap: 4px; font-size: 11.5px; color: var(--mid); }
.trace .src a { cursor: pointer; } .trace .src a:hover { color: var(--fg); }
.trace .verdict { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.trace .verdict span { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 11px; background: var(--bg); }
.trace .verdict span.ok { background: var(--acc); color: var(--on-acc); border-color: var(--acc); }
.trace .verdict span.no { background: #FF5A36; color: #fff; border-color: #FF5A36; }
.trace .idle { color: var(--mid); margin: auto; text-align: center; max-width: 34ch; }
.caret { display: inline-block; width: .55em; height: 1em; background: var(--fg); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (max-width: 560px) { .trace .ln { grid-template-columns: 84px 1fr; } .trace .ms { display: none; } }
/* six chapters */
.ch-head { padding: 13vh var(--g) 5vh; }
.ch-head .wrap { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }
.ch-head h2 { margin: 0; font-size: clamp(48px, 7vw, 120px); }
.chapters { position: relative; }
.track { display: flex; flex-direction: column; }
.panel { --pc: var(--bg); --pf: var(--fg); --pm: var(--mid); --pl: var(--line); position: relative; overflow: hidden; min-height: 100svh; padding: 12vh var(--g) 10vh; display: grid; align-content: center; gap: 30px; background: var(--pc); color: var(--pf); }
.panel.t-ink { --pc: #121211; --pf: #F1ECE3; --pm: #F1ECE399; --pl: #F1ECE326; }
.panel.t-lime { --pc: #B8FF3C; --pf: #121211; --pm: #121211A8; --pl: #1212122E; }
[data-theme="dark"] .panel.t-paper { --pc: #151516; }
.pnum { position: absolute; right: 3vw; bottom: -6vh; font: 800 clamp(160px, 30vw, 460px)/.8 var(--sans); font-variation-settings: "wdth" 70; color: transparent; -webkit-text-stroke: 1.5px var(--pl); pointer-events: none; }
.panel .l, .panel .r { display: grid; gap: 22px; position: relative; z-index: 1; align-content: center; }
.kick { color: var(--pm); }
.ptitle { margin: 0; font-size: clamp(52px, 7.4vw, 128px); }
.plede { margin: 0; font: 700 clamp(20px, 1.8vw, 28px)/1.25 var(--sans); letter-spacing: -.01em; max-width: 28ch; }
.pbody { margin: 0; color: var(--pm); font-size: 16px; line-height: 1.6; max-width: 52ch; }
.pmet { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.pmet b { font: 800 clamp(64px, 7.2vw, 124px)/.85 var(--sans); white-space: nowrap; font-variation-settings: "wdth" 75; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.t-paper .pmet b { background: linear-gradient(var(--acc), var(--acc)) no-repeat 0 88% / 100% 26%; }
.t-ink .pmet b { color: var(--acc); }
.pmet span { color: var(--pm); max-width: 20ch; }
.pstats { display: grid; grid-template-columns: repeat(3, minmax(0, auto)); justify-content: start; gap: 12px 28px; }
@media (max-width: 600px) { .pstats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pstats b { font-size: 24px; } }
.pstats b { display: block; font: 800 30px/1 var(--sans); font-variation-settings: "wdth" 80; }
.pstats span { color: var(--pm); max-width: 18ch; display: block; margin-top: 4px; }
.pipe span { border: 1px solid var(--pl); border-radius: 8px; padding: 6px 10px; transition: background .3s, color .3s; }
.pipe span.lit { background: var(--pf); color: var(--pc); }
.pipe i { color: var(--pm); font-style: normal; }
.chips span { border: 1px solid var(--pl, var(--line)); border-radius: 999px; padding: 6px 12px; font: 400 12px var(--mono); color: var(--pm, var(--mid)); }
.go { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid currentColor; font: 600 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; transition: background .3s, color .3s, border-color .3s; }
.panel .btn:hover { background: var(--pf); color: var(--pc); border-color: var(--pf); }
.t-lime .btn.hot { background: #121211; color: #B8FF3C; border-color: #121211; }
.hud { display: none; }
@media (min-width: 900px) {
  .chapters.h { height: 100svh; overflow: hidden; }
  .chapters.h .track { flex-direction: row; height: 100%; width: max-content; }
  .chapters.h .panel { width: 100vw; height: 100%; min-height: 0; grid-template-columns: 1.05fr 1fr; column-gap: 6vw; padding: 13vh 8vw 11vh 10vw; }
  .chapters.h .hud { display: flex; position: absolute; left: var(--g); right: var(--g); bottom: 22px; justify-content: space-between; align-items: center; gap: 24px; z-index: 5; mix-blend-mode: difference; color: #fff; }
  .hud .bar { flex: 1; height: 2px; background: #ffffff33; position: relative; }
  .hud .bar i { position: absolute; inset: 0; background: #fff; transform-origin: 0 50%; transform: scaleX(0); }
}
/* index table (from direction A) */
.idx .th, .idx summary { display: grid; grid-template-columns: 70px 1.6fr 1fr 1fr 150px; align-items: baseline; gap: 12px; }
.idx .th { padding: 0 0 10px; border-bottom: 1px solid var(--fg); color: var(--mid); }
.idx details { border-bottom: 1px solid var(--line); }
.idx summary { list-style: none; cursor: pointer; padding: 20px 0 18px; transition: background .25s, padding .25s; }
.idx summary::-webkit-details-marker { display: none; }
.idx .t { font: 700 clamp(20px, 2vw, 28px)/1.1 var(--sans); letter-spacing: -.01em; }
.idx .k { text-align: right; font: 800 clamp(20px, 2vw, 28px)/1 var(--sans); font-variation-settings: "wdth" 75; }
.idx .m { color: var(--mid); font-size: 14px; }
@media (hover: hover) { .idx summary:hover { background: var(--acc); color: var(--on-acc); padding-left: 14px; padding-right: 14px; } .idx summary:hover .m { color: inherit; } }
.idx details[open] summary { background: var(--fg); color: var(--bg); padding-left: 14px; padding-right: 14px; } .idx details[open] summary .m { color: inherit; opacity: .7; }
.idx .body { padding: 18px 0 26px 82px; display: grid; gap: 14px; max-width: 900px; }
.idx .body p { margin: 0; font-size: 17px; line-height: 1.55; }
@media (max-width: 760px) { .idx .th { display: none; } .idx summary { grid-template-columns: 40px 1fr auto; } .idx .m { display: none; } .idx .body { padding-left: 0; } }
/* story so far (from direction B) */
.story { display: grid; grid-template-columns: 1fr; gap: 6vh; }
@media (min-width: 1000px) { .story { grid-template-columns: .9fr 1.3fr; } .story .sticky { position: sticky; top: 16vh; align-self: start; } }
.story h2 { margin: 0; font-size: clamp(56px, 7.6vw, 128px); }
.story .sub { margin: 20px 0 0; color: var(--mid); max-width: 36ch; font-size: 18px; }
.tl { position: relative; padding-left: 40px; display: grid; gap: 0; }
.tl::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 0; width: 2px; background: var(--line); }
.tl .line { position: absolute; left: 5px; top: 8px; bottom: 0; width: 4px; border-radius: 4px; background: var(--acc); box-shadow: 0 0 0 1px var(--ring); transform-origin: 50% 0; }
.grp { margin: 34px 0 10px; color: var(--mid); } .grp:first-of-type { margin-top: 0; }
.ev { position: relative; display: grid; gap: 6px; padding: 16px 0 22px; border-bottom: 1px solid var(--line); }
.ev::before { content: ""; position: absolute; left: -40px; top: 22px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 2px solid var(--fg); transition: background .3s, transform .4s var(--pop); }
.ev:hover::before { background: var(--acc); transform: scale(1.35); }
.ev .when { color: var(--mid); }
.ev h3 { margin: 0; font: 800 clamp(24px, 2.4vw, 34px)/1.05 var(--sans); font-variation-settings: "wdth" 90; letter-spacing: -.015em; }

  DOCS.forEach((d) => Object.keys(d.tf).forEach((t) => (DF[t] = (DF[t] || 0) + 1)));
}
const idf = (t) => Math.log(1 + (DOCS.length - (DF[t] || 0) + .5) / ((DF[t] || 0) + .5));

  // flagship cards: stagger in, light pipelines, 3D tilt + shine on desktop
  gsap.from(".fc", { y: 80, opacity: 0, rotate: (i) => [-2, 0, 2][i], stagger: .12, duration: 1.1, ease: "expo.out", scrollTrigger: { trigger: ".feat", start: "top 82%", onEnter: () => $$(".fc").forEach((f, i) => setTimeout(() => lightPipe(f), 400 + i * 250)) } });
  gsap.from(".do2 .c", { y: 40, opacity: 0, stagger: .07, duration: .9, ease: "expo.out", scrollTrigger: { trigger: ".do2", start: "top 82%" } });
  if (fine) $$(".fc").forEach((f) => {
    const rx = gsap.quickTo(f, "rotationX", { duration: .6, ease: "power3" }), ry = gsap.quickTo(f, "rotationY", { duration: .6, ease: "power3" });
    f.addEventListener("pointermove", (ev) => { const b = f.getBoundingClientRect(), x = (ev.clientX - b.left) / b.width, y = (ev.clientY - b.top) / b.height; ry((x - .5) * 10); rx((.5 - y) * 8); f.style.setProperty("--mx", x * 100 + "%"); f.style.setProperty("--my", y * 100 + "%"); });
    f.addEventListener("pointerleave", () => { rx(0); ry(0); });
  });

  });
  later.push(() => {
  // six chapters: pinned horizontal track on desktop, stacked on mobile
  const chapters = $("#chapters"), panels = $$(".panel");
  if (desk) {
    chapters.classList.add("h");
    const track = chapters.querySelector(".track"), dist = () => track.scrollWidth - innerWidth;
    const cur = chapters.querySelector(".hud .cur"), bar = chapters.querySelector(".hud .bar i");
    const scroller = gsap.to(track, { x: () => -dist(), ease: "none", scrollTrigger: { trigger: chapters, start: "top top", end: () => "+=" + dist(), pin: true, scrub: .6, invalidateOnRefresh: true, anticipatePin: 1,
      onUpdate: (st) => { bar.style.transform = `scaleX(${st.progress})`; } }, onUpdate: () => { const x = -gsap.getProperty(track, "x") + innerWidth / 2; const k = Math.max(0, panels.findIndex((p) => p.offsetLeft + p.offsetWidth > x)); cur.textContent = `0${k + 1} / 0${CH.length}`; } });
    panels.forEach((panel, i) => {
      const parts = panel.querySelectorAll(".kick, .ptitle, .plede, .pbody, .pmet, .pstats, .pipe, .chips, .go, .flow li, .stage");
      const trig = i === 0 ? { trigger: chapters, start: "top 55%" } : { trigger: panel, containerAnimation: scroller, start: "left 70%" };
      gsap.from(parts, { y: 40, opacity: 0, stagger: .05, duration: .9, ease: "expo.out", scrollTrigger: trig });
      ScrollTrigger.create({ ...(i === 0 ? { trigger: chapters, start: "top 40%" } : { trigger: panel, containerAnimation: scroller, start: "left 60%" }), once: true, onEnter: () => { countUp(panel.querySelector(".pmet b")); lightPipe(panel); if (panel.classList.contains("wide")) { showStage(0); walk(); } } });
      gsap.fromTo(panel.querySelector(".pnum"), { xPercent: 25 }, { xPercent: -25, ease: "none", scrollTrigger: i === 0 ? { trigger: chapters, start: "top top", end: () => "+=" + innerWidth, scrub: true } : { trigger: panel, containerAnimation: scroller, start: "left right", end: "right left", scrub: true } });
    });
  } else {
    panels.forEach((panel) => { if (panel.classList.contains("wide")) ScrollTrigger.create({ trigger: panel, start: "top 60%", once: true, onEnter: walk }); gsap.from(panel.querySelectorAll(".kick, .ptitle, .plede, .pbody, .pmet, .pstats, .pipe, .chips, .go"), { y: 30, opacity: 0, stagger: .05, duration: .8, ease: "expo.out", scrollTrigger: { trigger: panel, start: "top 75%" } }); ScrollTrigger.create({ trigger: panel.querySelector(".pmet"), start: "top 85%", once: true, onEnter: () => { countUp(panel.querySelector(".pmet b")); lightPipe(panel); } }); });
  }
  });
  later.push(() => {
  // story so far: line draws itself, events slide in
  gsap.fromTo(".tl .line", { scaleY: 0 }, { scaleY: 1, ease: "none", scrollTrigger: { trigger: ".tl", start: "top 70%", end: "bottom 70%", scrub: true } });
  // one batched trigger for ~20 timeline items instead of one each
  ScrollTrigger.batch(".ev, .hk a, .grp, .cert", { start: "top 88%", once: true, batchMax: 4, onEnter: (els) => gsap.from(els, { opacity: 0, x: 30, duration: .8, stagger: .06, ease: "expo.out", overwrite: true }) });
  gsap.from(".kit button", { opacity: 0, y: 20, stagger: .04, duration: .7, ease: "expo.out", scrollTrigger: { trigger: ".kit", start: "top 85%" } });
  gsap.from(".links a", { opacity: 0, y: 30, rotate: -3, stagger: .06, duration: .8, ease: "back.out(1.7)", scrollTrigger: { trigger: ".links", start: "top 88%" } });
  // active section → doodle underline in nav
  [["about", "About"], ["work", "Work"], ["ask", "Agent"], ["story", "Story"], ["contact", "Contact"]].forEach(([id, t]) => ScrollTrigger.create({ trigger: "#" + id, start: "top 50%", end: "bottom 50%", onToggle: (st) => $(`[data-s="${t}"]`).classList.toggle("on", st.isActive) }));

  const rev = $("#rev"), back = rev.querySelector(".back");
  if (fine) {
    const dot = $("#dot"), qx = gsap.quickTo(dot, "x", { duration: .35, ease: "power3" }), qy = gsap.quickTo(dot, "y", { duration: .35, ease: "power3" });
    let px = -100, py = -100; const r = { v: 0 };
    const place = () => { const b = back.getBoundingClientRect(); back.style.setProperty("--x", px - b.left + "px"); back.style.setProperty("--y", py - b.top + "px"); back.style.setProperty("--r", r.v + "px"); };
    addEventListener("pointermove", (ev) => { px = ev.clientX; py = ev.clientY; qx(px); qy(py); place(); }, { passive: true });
    addEventListener("scroll", place, { passive: true });
    rev.addEventListener("pointerenter", () => { gsap.to(r, { v: 170, duration: .6, ease: "expo.out", onUpdate: place }); gsap.to(dot, { scale: 0, duration: .3 }); });
    rev.addEventListener("pointerleave", () => { gsap.to(r, { v: 0, duration: .4, ease: "power3.in", onUpdate: place }); gsap.to(dot, { scale: 1, duration: .3 }); });
    $$("a, button, summary").forEach((a) => { a.addEventListener("pointerenter", () => gsap.to(dot, { scale: 2.2, duration: .3 })); a.addEventListener("pointerleave", () => gsap.to(dot, { scale: 1, duration: .3 })); });
    $$(".mag, .run, .theme, .askf button").forEach((m) => { const mx = gsap.quickTo(m, "x", { duration: .5, ease: "elastic.out(1,.4)" }), my = gsap.quickTo(m, "y", { duration: .5, ease: "elastic.out(1,.4)" }); m.addEventListener("pointermove", (ev) => { const b = m.getBoundingClientRect(); mx((ev.clientX - b.left - b.width / 2) * .3); my((ev.clientY - b.top - b.height / 2) * .35); }); m.addEventListener("pointerleave", () => { mx(0); my(0); }); });
    const chars = "AGENTRAG01<>/*";
    $$("[data-s]").forEach((a) => { const txt = a.dataset.s, svg = a.querySelector("svg"); let iv; a.addEventListener("pointerenter", () => { clearInterval(iv); let f = 0; iv = setInterval(() => { a.firstChild.textContent = txt.split("").map((c, i) => (i < f / 2 ? c : chars[(Math.random() * chars.length) | 0])).join(""); if (++f > txt.length * 2) { clearInterval(iv); a.firstChild.textContent = txt; } }, 28); }); a.addEventListener("pointerleave", () => { clearInterval(iv); a.firstChild.textContent = txt; }); });
  } else {
    ScrollTrigger.create({ trigger: rev, start: "top 70%", end: "bottom 20%", scrub: true, onUpdate: (st) => { const p = st.progress, b = back.getBoundingClientRect(); back.style.setProperty("--x", (0.15 + 0.7 * p) * b.width + "px"); back.style.setProperty("--y", (0.35 + 0.3 * Math.sin(p * Math.PI * 2)) * b.height + "px"); back.style.setProperty("--r", Math.sin(p * Math.PI) * 120 + "px"); } });
  }
  ScrollTrigger.refresh();
  });
  /* None of it is needed to read the hero, so it is built from the first scroll (or 4 s in, whichever
     comes first) in idle-sized steps — startup stays free for the hero and the agent graph. */
  later.push(fitOnce); // after the chapter track has taken its horizontal layout, so titles measure the right column
  const pump = () => { const f = later.shift(); if (!f) return; f(); if (later.length) idle(pump); };
  const EV = ["scroll", "wheel", "touchstart", "pointerdown", "keydown"];
  let armed = false;
  const arm = () => { if (armed) return; armed = true; EV.forEach((t) => removeEventListener(t, arm)); idle(pump, 200); };
  EV.forEach((t) => addEventListener(t, arm, { passive: true }));
  setTimeout(arm, 4000);
}
</script>
</body>
